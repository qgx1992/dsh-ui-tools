<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-ui-tools 插件设置页预览</title>
<style>
  :root {
    --dsw-alias-brand-primary: #4176e6;
    --dsw-alias-brand-text: #4176e6;
    --dsw-alias-label-primary: #1f2329;
    --dsw-alias-label-secondary: #5c6470;
    --dsw-alias-label-caption: #8a919e;
    --dsw-alias-label-tertiary: #a1a8b3;
    --dsw-alias-interactive-bg-hover: rgba(31,35,41,.06);
    --dsw-alias-border-l1: #eef0f3;
    --dsw-alias-border-l2: #e3e6eb;
    --dsw-alias-bg-base: #ffffff;
    --dsw-shadow-lv3: 0 12px 32px rgba(15,17,21,.16);
  }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; color: var(--dsw-alias-label-primary); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--dsw-alias-label-secondary); margin-bottom: 24px; line-height: 20px; }
  .mock { background: var(--dsw-alias-bg-base); border: 1px solid var(--dsw-alias-border-l2); border-radius: 12px; box-shadow: var(--dsw-shadow-lv3); overflow: hidden; max-width: 640px; }
  .settings-shell { display: flex; min-height: 300px; }
  .nav { width: 150px; flex: none; border-right: 1px solid var(--dsw-alias-border-l1); padding: 10px 8px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { padding: 6px 10px; border-radius: 6px; color: var(--dsw-alias-label-secondary); }
  .nav-item.active { background: color-mix(in srgb, var(--dsw-alias-brand-primary, #4176e6) 10%, transparent); color: var(--dsw-alias-brand-text, var(--dsw-alias-brand-primary, #4176e6)); font-weight: 500; }
  .content { flex: 1; min-width: 0; padding: 16px 20px 20px; }
  .bar { padding: 12px 16px; color: var(--dsw-alias-label-caption); font-size: 12px; }

  /* ═══ 插件注入的样式（与 lib/client.js 的 SET_CSS 一致）═══ */
  [data-set-root] {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 4px 2px 12px;
  }
  [data-set-root] .set-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  [data-set-root] .set-group-title {
    color: var(--dsw-alias-label-secondary, #5c6470);
    font-size: 13px;
    font-weight: 600;
    line-height: 20px;
  }
  [data-set-root] .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--dsw-specific-surface-hover, rgba(127,127,127,.06));
    cursor: pointer;
  }
  [data-set-root] .set-row:hover {
    background: var(--dsw-specific-surface-active, rgba(127,127,127,.1));
  }
  [data-set-root] .set-row-label {
    color: var(--dsw-alias-label-primary, #1f2329);
    font-size: 13px;
    line-height: 20px;
  }
  [data-set-root] .set-toggle {
    width: 36px;
    height: 20px;
    flex: none;
    accent-color: var(--dsw-alias-brand-primary, #4176e6);
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>插件设置页「DSH UI 工具」（静态预览）</h1>
  <div class="sub">模拟官方设置中心：导航新增「DSH UI 工具」页（v0.4.0 新增；v0.4.1 移除快捷命令条后仅剩布局偏好）。</div>

  <div class="mock">
    <div class="settings-shell">
      <div class="nav">
        <div class="nav-item">常规</div>
        <div class="nav-item active">DSH UI 工具</div>
        <div class="nav-item">模型</div>
        <div class="nav-item">插件</div>
      </div>
      <div class="content">
        <!-- 插件注入的设置页主体 -->
        <div data-set-root class="set-root">
          <div class="set-group">
            <div class="set-group-title">布局偏好</div>
            <label class="set-row" data-set-row>
              <span class="set-row-label">会话标题旁显示工作区徽章</span>
              <input type="checkbox" class="set-toggle" checked>
            </label>
            <label class="set-row" data-set-row>
              <span class="set-row-label">启动时默认折叠所有工作区分组</span>
              <input type="checkbox" class="set-toggle">
            </label>
            <label class="set-row" data-set-row>
              <span class="set-row-label">「修改的文件」使用紧凑单行显示</span>
              <input type="checkbox" class="set-toggle">
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="bar">↑ 设置中心里的「DSH UI 工具」页；开关经 localStorage（dsh-ui-tools:prefs:v1）持久化</div>
  </div>

  <div class="hint" style="font-size:12px;color:var(--dsw-alias-label-tertiary);margin-top:14px;line-height:20px">
    注：静态预览为手写 HTML 样式视图；真实注册在官方 <code>settings.section</code> 槽（root 作用域 list，id <code>dsh-ui-tools</code>、order 100），
    开关写入偏好仓库后由各功能组件即时生效。
  </div>
</body>
</html>
