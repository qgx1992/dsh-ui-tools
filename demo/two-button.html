<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>dsh-model-select-style 双按钮模型选择</title>
<style>
  :root {
    --dsw-alias-brand-primary: #4176e6;
    --dsw-alias-brand-text: #4176e6;
    --dsw-alias-label-primary: #1f2329;
    --dsw-alias-label-secondary: #5c6470;
    --dsw-alias-label-caption: #8a919e;
    --dsw-alias-label-tertiary: #a1a8b3;
    --dsw-alias-interactive-bg-hover: rgba(31,35,41,.06);
    --dsw-alias-border-l2: #e3e6eb;
    --dsw-alias-border-l3: #d3d7de;
    --dsw-specific-menu: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-shadow-lv3: 0 12px 32px rgba(15,17,21,.16);
  }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; color: var(--dsw-alias-label-primary); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--dsw-alias-label-secondary); margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid var(--dsw-alias-border-l2); border-radius: 12px; padding: 16px; max-width: 560px; }
  .composer { border: 1px solid var(--dsw-alias-border-l3); border-radius: 12px; background: #fff; padding: 12px 12px 8px; min-height: 130px; }
  .placeholder { color: var(--dsw-alias-label-tertiary); font-size: 13px; }
  .footer { display: flex; justify-content: flex-end; align-items: center; padding-top: 10px; gap: 6px; }

  /* ═══ 插件注入的样式（与 lib/client.js 生成的一致）═══ */
  [data-mss-seat] { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  [data-mss-btn] {
    position: relative; display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 9px; border: none; border-radius: 8px;
    background: color-mix(in srgb, var(--mss-accent, #4176e6) 8%, transparent);
    color: var(--mss-accent-text, #4176e6); font-size: 12px; font-weight: 500;
    line-height: 20px; cursor: pointer; white-space: nowrap; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis;
    transition: background .16s cubic-bezier(.4,0,.2,1), box-shadow .16s cubic-bezier(.4,0,.2,1);
    outline: none; font-family: inherit;
  }
  [data-mss-btn]:hover:not(:disabled) { background: color-mix(in srgb, var(--mss-accent, #4176e6) 16%, transparent); }
  [data-mss-btn]:focus-visible { box-shadow: 0 0 0 2px color-mix(in srgb, var(--mss-accent, #4176e6) 55%, transparent); }
  [data-mss-btn]:disabled { cursor: default; opacity: .55; }
  [data-mss-btn][aria-expanded="true"] { background: color-mix(in srgb, var(--mss-accent, #4176e6) 16%, transparent); }
  [data-mss-btn] .mss-caret { color: inherit; opacity: .7; flex: none; transition: transform .16s; }
  [data-mss-btn][aria-expanded="true"] .mss-caret { transform: rotate(180deg); }
  [data-mss-panel] {
    position: absolute; bottom: calc(100% + 6px); right: 0; z-index: 120;
    min-width: 200px; max-width: min(320px, 70vw); max-height: min(340px, 60vh);
    overflow: auto;
    background: color-mix(in srgb, var(--dsw-specific-menu, #fff) 90%, transparent);
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.08));
    border-radius: 12px; box-shadow: var(--dsw-shadow-lv3); padding: 4px;
    color: var(--dsw-alias-label-primary);
  }
  [data-mss-panel] .mss-group-title { color: var(--dsw-alias-label-tertiary); font-size: 11px; line-height: 18px; padding: 5px 8px 2px; }
  [data-mss-panel] .mss-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; padding: 6px 8px; border: none; border-radius: 8px;
    background: none; color: inherit; font: inherit; font-size: 13px; line-height: 20px;
    text-align: left; cursor: pointer; transition: background .16s;
  }
  [data-mss-panel] .mss-row:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
  [data-mss-panel] .mss-row[aria-checked="true"] { background: color-mix(in srgb, var(--mss-accent, #4176e6) 12%, transparent); }
  [data-mss-panel] .mss-row .mss-check { color: var(--mss-accent-text, #4176e6); flex: none; font-size: 14px; }
  [data-mss-panel] .mss-row .mss-desc { display: block; color: var(--dsw-alias-label-caption); font-size: 11px; line-height: 16px; }
  [data-mss-panel] .mss-empty, [data-mss-panel] .mss-loading { padding: 10px 8px; color: var(--dsw-alias-label-tertiary); font-size: 12px; }
  .hint { font-size: 12px; color: var(--dsw-alias-label-tertiary); margin-top: 14px; line-height: 20px; }
</style>
</head>
<body>
  <h1>双按钮模型选择（模拟）</h1>
  <div class="sub">供应商按钮 → 供应商列表；模型按钮 → 该供应商的模型列表（两级联动）</div>
  <div class="card">
    <div class="composer">
      <div class="placeholder">输入消息…</div>
      <div class="footer">
        <div data-mss-seat id="seat" style="position:relative">
          <button data-mss-btn type="button" id="btn-provider" aria-haspopup="listbox" aria-expanded="false">未选供应商 <span class="mss-caret">▾</span></button>
          <button data-mss-btn type="button" id="btn-model" aria-haspopup="listbox" aria-expanded="false" disabled>请先选择供应商 <span class="mss-caret">▾</span></button>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">点击「未选供应商」→ 选一个供应商 → 「模型」按钮亮起 → 点它列出该供应商的模型</div>
  </div>

<script>
  // ── 模拟数据 ──
  const DIRECTORY = {
    "DeepSeek": [
      { id: "deepseek-chat", name: "deepseek-chat", description: "通用对话" },
      { id: "deepseek-reasoner", name: "deepseek-reasoner", description: "深度推理" }
    ],
    "SiliconFlow": [
      { id: "qwen2.5-72b", name: "Qwen2.5-72B", description: "开源大模型" },
      { id: "glm-4-plus", name: "GLM-4-Plus", description: "智谱" }
    ],
    "OpenRouter": [
      { id: "claude-3.7-sonnet", name: "Claude 3.7 Sonnet", description: "Anthropic" },
      { id: "gpt-4o", name: "GPT-4o", description: "OpenAI" }
    ]
  };

  const seat = document.getElementById("seat");
  const btnP = document.getElementById("btn-provider");
  const btnM = document.getElementById("btn-model");
  const hint = document.getElementById("hint");
  let open = null;         // null | "provider" | "model"
  let providerId = null;   // 选中的供应商名

  function closePanel() { const p = seat.querySelector('[data-mss-panel]'); if (p) p.remove(); open = null; btnP.setAttribute("aria-expanded", "false"); btnM.setAttribute("aria-expanded", "false"); }

  function openPanel(kind) {
    closePanel();
    if (open === kind) { open = null; return; }
    open = kind;
    const panel = document.createElement("div");
    panel.setAttribute("data-mss-panel", "");
    if (kind === "provider") {
      for (const name of Object.keys(DIRECTORY)) {
        const row = document.createElement("button");
        row.className = "mss-row"; row.type = "button";
        row.setAttribute("aria-checked", name === providerId ? "true" : "false");
        row.innerHTML = name + (name === providerId ? '<span class="mss-check">✓</span>' : '');
        row.onclick = () => { providerId = name; renderButtons(); closePanel(); };
        panel.appendChild(row);
      }
      btnP.setAttribute("aria-expanded", "true");
    } else {
      const models = DIRECTORY[providerId] || [];
      const title = document.createElement("div");
      title.className = "mss-group-title"; title.textContent = providerId;
      panel.appendChild(title);
      for (const m of models) {
        const row = document.createElement("button");
        row.className = "mss-row"; row.type = "button";
        row.innerHTML = '<span>' + m.name + '<span class="mss-desc">' + m.description + '</span></span>';
        row.onclick = () => { hint.textContent = "已选择 " + providerId + " / " + m.name; closePanel(); };
        panel.appendChild(row);
      }
      btnM.setAttribute("aria-expanded", "true");
    }
    seat.appendChild(panel);
  }

  function renderButtons() {
    btnP.firstChild.textContent = providerId || "未选供应商";
    btnM.disabled = providerId === null;
    btnM.firstChild.textContent = providerId ? "选择模型" : "请先选择供应商";
  }

  btnP.onclick = () => openPanel("provider");
  btnM.onclick = () => openPanel("model");
  document.addEventListener("mousedown", (e) => { if (!seat.contains(e.target)) closePanel(); });
</script>
</body>
</html>
