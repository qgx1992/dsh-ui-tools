<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>双按钮模型选择 · 供应商面板展开</title>
<style>
  :root {
    --dsw-alias-brand-primary: #4176e6;
    --dsw-alias-brand-text: #4176e6;
    --dsw-alias-label-primary: #1f2329;
    --dsw-alias-label-secondary: #5c6470;
    --dsw-alias-label-caption: #8a919e;
    --dsw-alias-label-tertiary: #a1a8b3;
    --dsw-alias-interactive-bg-hover: rgba(31,35,41,.06);
    --dsw-alias-border-l2: #e3e6eb;
    --dsw-alias-border-l3: #d3d7de;
    --dsw-specific-menu: #ffffff;
    --dsw-shadow-lv3: 0 12px 32px rgba(15,17,21,.16);
  }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; color: var(--dsw-alias-label-primary); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--dsw-alias-label-secondary); margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid var(--dsw-alias-border-l2); border-radius: 12px; padding: 16px; max-width: 560px; }
  /* v0.4.12：实机 composer 是深色底（两个主按钮的常态文字已按用户要求改为纯白），
     这里把预览用的输入框也做成深色，否则白字在这张预览页上会看不见。 */
  .composer { border: 1px solid rgba(255,255,255,.14); border-radius: 12px; background: #17181c; padding: 12px 12px 8px; min-height: 130px;
    /* v0.4.16：按钮文字色改为主题自适应 token，预览页的 composer 是深色底，
       这里把 label-primary / border-l2 覆写成内核深色主题下的实际取值
       （bluish-50 / #ffffff1f），否则预览里会是一段近黑字配深底。 */
    --dsw-alias-label-primary: #f9fafb; --dsw-alias-border-l2: #ffffff1f; }
  .placeholder { color: #8b9099; font-size: 13px; }
  .footer { display: flex; justify-content: flex-end; align-items: center; padding-top: 10px; gap: 6px; }
  [data-mss-seat] { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  [data-mss-btn] {
    position: relative; display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 9px; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); border-radius: 8px;
    /* v0.4.11：常态背景=完全透明；v0.4.16：加 1px 淡描边，文字色随主题自适应 */
    /* v0.4.11：两个主按钮（供应商 / 模型）的常态背景=完全透明 */
    /* v0.4.12：常态文字色=纯白（实机 composer 为深色底，白字对比最高） */
    background: transparent;
    color: var(--dsw-alias-label-primary, #e9ecef); font-size: 12px; font-weight: 500;
    line-height: 20px; cursor: pointer; white-space: nowrap; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis;
    transition: background .16s cubic-bezier(.4,0,.2,1), box-shadow .16s cubic-bezier(.4,0,.2,1);
    outline: none; font-family: inherit;
  }
  [data-mss-btn]:hover:not(:disabled) { background: color-mix(in srgb, var(--mss-accent, #4176e6) 16%, transparent); }
  [data-mss-btn]:disabled { cursor: default; opacity: .55; }
  [data-mss-btn][aria-expanded="true"] { background: color-mix(in srgb, var(--mss-accent, #4176e6) 16%, transparent); }
  [data-mss-btn] .mss-caret { color: inherit; opacity: .7; flex: none; }
  [data-mss-panel] {
    position: absolute; bottom: calc(100% + 6px); right: 0; z-index: 120;
    min-width: 200px; max-width: min(320px, 70vw); max-height: min(340px, 60vh);
    overflow: auto;
    background: #f8f9fa;
    border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.08));
    border-radius: 12px; box-shadow: var(--dsw-shadow-lv3); padding: 4px;
    color: var(--dsw-alias-label-primary);
  }
  /* v0.4.18：面板内每个文字层与交互底全部改成字面值（深浅两套），不再引用内核
     label-* / brand-* / interactive-bg token —— 那些 token 跟随内核表面，与本插件
     写死的实底 #f8f9fa / #2c2c2e 是两套体系，不同步就会发灰或隐形。 */
  [data-mss-panel] .mss-group-title { color: #5f6469; font-size: 11px; line-height: 18px; padding: 5px 8px 2px; }
  [data-mss-panel] .mss-row:hover:not(:disabled) { background: rgba(0, 0, 0, .06); }
  [data-mss-panel] .mss-row[aria-checked="true"] { background: rgba(65, 118, 230, .12); }
  [data-mss-panel] .mss-row[aria-checked="true"]:hover:not(:disabled) { background: rgba(65, 118, 230, .18); }
  [data-mss-panel] .mss-row .mss-check { color: #4176e6; flex: none; font-size: 14px; }
  [data-mss-panel] .mss-row .mss-desc { display: block; color: #6a7079; font-size: 11px; line-height: 16px; }
  [data-mss-panel] .mss-empty, [data-mss-panel] .mss-loading { padding: 10px 8px; color: #5f6469; font-size: 12px; line-height: 18px; }
  html[data-ds-dark-theme] [data-mss-panel], [data-ds-dark-theme] [data-mss-panel] { background: #2c2c2e; color: #f9fafb; }
  html[data-ds-dark-theme] [data-mss-panel] .mss-group-title,
  [data-ds-dark-theme] [data-mss-panel] .mss-group-title { color: #b9bec6; }
  html[data-ds-dark-theme] [data-mss-panel] .mss-row:hover:not(:disabled),
  [data-ds-dark-theme] [data-mss-panel] .mss-row:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
  html[data-ds-dark-theme] [data-mss-panel] .mss-row[aria-checked="true"],
  [data-ds-dark-theme] [data-mss-panel] .mss-row[aria-checked="true"] { background: rgba(90, 140, 250, .22); }
  html[data-ds-dark-theme] [data-mss-panel] .mss-row[aria-checked="true"]:hover:not(:disabled),
  [data-ds-dark-theme] [data-mss-panel] .mss-row[aria-checked="true"]:hover:not(:disabled) { background: rgba(90, 140, 250, .28); }
  html[data-ds-dark-theme] [data-mss-panel] .mss-row .mss-check,
  [data-ds-dark-theme] [data-mss-panel] .mss-row .mss-check { color: #6a9bff; }
  html[data-ds-dark-theme] [data-mss-panel] .mss-row .mss-desc,
  [data-ds-dark-theme] [data-mss-panel] .mss-row .mss-desc { color: #a7adb6; }
  html[data-ds-dark-theme] [data-mss-panel] .mss-empty,
  html[data-ds-dark-theme] [data-mss-panel] .mss-loading,
  [data-ds-dark-theme] [data-mss-panel] .mss-empty,
  [data-ds-dark-theme] [data-mss-panel] .mss-loading { color: #b9bec6; }
</style>
</head>
<body>
  <h1>双按钮模型选择 · 供应商面板展开</h1>
  <div class="sub">点「供应商」按钮 → 弹出供应商列表（此快照已展开）</div>
  <div class="card">
    <div class="composer">
      <div class="placeholder">输入消息…</div>
      <div class="footer">
        <div data-mss-seat style="position:relative">
          <button data-mss-btn type="button" aria-haspopup="listbox" aria-expanded="true">未选供应商 <span class="mss-caret">▾</span></button>
          <button data-mss-btn type="button" aria-haspopup="listbox" aria-expanded="false" disabled>请先选择供应商 <span class="mss-caret">▾</span></button>
          <div data-mss-panel role="listbox">
            <button class="mss-row" type="button" role="option" aria-checked="false"><span>DeepSeek</span></button>
            <button class="mss-row" type="button" role="option" aria-checked="false"><span>SiliconFlow</span></button>
            <button class="mss-row" type="button" role="option" aria-checked="false"><span>OpenRouter</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
